[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privmapper"
version = "2.0.0"
description = "AWS IAM privilege-escalation analysis and reporting, built on PMapper"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sid", email = "dr34mhacks@users.noreply.github.com" }]
keywords = ["aws", "iam", "security", "privilege-escalation", "pmapper", "pentest", "cloud-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Analysing an existing PMapper graph needs only the standard library.
dependencies = []

[project.optional-dependencies]
# Only needed for live collection with `--profile` (runs the pmapper CLI + AWS CLI).
pmapper = ["principalmapper>=1.1.0"]
dev = ["pyflakes", "build"]

[project.scripts]
privmapper = "privmapper.cli:main"

[project.urls]
Homepage = "https://github.com/dr34mhacks/privmapper"
Issues = "https://github.com/dr34mhacks/privmapper/issues"

# The installable package is the modular source under src/privmapper.
# The standalone single-file build (privmapper.py at the repo root) is a convenience
# script and is intentionally NOT part of the wheel.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privmapper = ["py.typed", "reporting/vendor/*.js", "reporting/vendor/fonts/*.ttf"]
